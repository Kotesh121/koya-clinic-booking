
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: koya-clinic-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/clinic.db
    volumes:
      - clinic_data:/data
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_KEY: ${API_KEY}
    container_name: koya-clinic-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  clinic_data:

