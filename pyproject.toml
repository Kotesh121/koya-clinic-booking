[project]
name = "koya-clinic-booking"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.5.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.27.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
